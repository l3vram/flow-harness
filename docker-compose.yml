name: flow-harness

services:
  # Run the full suite in a clean, freshly built image.
  #   docker compose run --rm test
  test:
    build:
      context: .
      target: test
    image: flow-harness-test

  # The `flow` CLI. Run state persists in the named volume mounted at /work.
  #   docker compose run --rm flow init demo "build a small API"
  #   docker compose run --rm flow add api backend sonnet
  #   docker compose run --rm flow panel
  flow:
    build:
      context: .
      target: runtime
    image: flow-harness
    volumes:
      - flow-state:/work

  # The MCP server over stdio. An MCP host launches it and speaks the protocol on stdio:
  #   docker compose run -i --rm mcp
  # Runs live under /work/.flow/runs/<runId> on the shared volume. A network (HTTP) transport
  # and a real `docker compose up` daemon arrive with remote deployment.
  mcp:
    build:
      context: .
      target: runtime
    image: flow-harness
    entrypoint: ["node", "/app/packages/mcp-server/dist/stdio.js"]
    environment:
      FLOW_HOME: /work/.flow
    volumes:
      - flow-state:/work
    stdin_open: true

  # The `flow-llm` CLI — a provider-neutral one-shot completion, offline by default.
  #   docker compose run --rm llm "summarize this repo"
  #   docker compose run --rm -e FLOW_LLM_PROVIDER=openai -e FLOW_LLM_BASE_URL=... llm "..."
  llm:
    build:
      context: .
      target: runtime
    image: flow-harness
    entrypoint: ["node", "/app/packages/llm/dist/cli.js"]
    environment:
      FLOW_LLM_PROVIDER: ${FLOW_LLM_PROVIDER:-fake}
      FLOW_LLM_BASE_URL: ${FLOW_LLM_BASE_URL:-}
      FLOW_LLM_API_KEY: ${FLOW_LLM_API_KEY:-}
      FLOW_LLM_MODEL: ${FLOW_LLM_MODEL:-}
      FLOW_LLM_TIER: ${FLOW_LLM_TIER:-sonnet}

  # The `flow-ceo` CLI — the thin executive loop, one run per invocation.
  #   docker compose run --rm ceo <runId>
  ceo:
    build:
      context: .
      target: runtime
    image: flow-harness
    entrypoint: ["node", "/app/packages/ceo/dist/cli.js"]
    environment:
      FLOW_HOME: /work/.flow
      FLOW_LLM_PROVIDER: ${FLOW_LLM_PROVIDER:-fake}
      FLOW_LLM_BASE_URL: ${FLOW_LLM_BASE_URL:-}
      FLOW_LLM_API_KEY: ${FLOW_LLM_API_KEY:-}
      FLOW_LLM_MODEL: ${FLOW_LLM_MODEL:-}
      FLOW_LLM_TIER: ${FLOW_LLM_TIER:-sonnet}
      FLOW_CEO_AUTO_APPLY: ${FLOW_CEO_AUTO_APPLY:-}
    volumes:
      - flow-state:/work

  # The `flow-context` CLI — deterministic, LLM-free repo indexing + ranked context bundles.
  #   docker compose run --rm context "circuit breaker"
  context:
    build:
      context: .
      target: runtime
    image: flow-harness
    entrypoint: ["node", "/app/packages/context/dist/cli.js"]
    environment:
      FLOW_CONTEXT_ROOT: /project
    volumes:
      - ./:/project:ro

  # Iterate on the source with the suite in watch mode. Source is mounted; deps stay in the
  # image. Rebuilds and re-runs on change.
  #   docker compose up dev
  dev:
    build:
      context: .
      target: build
    image: flow-harness-build
    volumes:
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./vitest.config.ts:/app/vitest.config.ts
    command: npm run test:watch

  # The `flow-exec` CLI — asks the model for full file contents, applies them inside the
  # target directory only, then runs the configured verify command.
  #   docker compose run --rm exec /work "create hello.js that prints hi"
  # (needs a real LLM backend)
  exec:
    build:
      context: .
      target: runtime
    image: flow-harness
    entrypoint: ["node", "/app/packages/executor/dist/cli.js"]
    environment:
      FLOW_LLM_PROVIDER: ${FLOW_LLM_PROVIDER:-fake}
      FLOW_LLM_BASE_URL: ${FLOW_LLM_BASE_URL:-}
      FLOW_LLM_API_KEY: ${FLOW_LLM_API_KEY:-}
      FLOW_LLM_MODEL: ${FLOW_LLM_MODEL:-}
      FLOW_LLM_TIER: ${FLOW_LLM_TIER:-sonnet}
      FLOW_EXEC_VERIFY: ${FLOW_EXEC_VERIFY:-}
    volumes:
      - exec-work:/work

  # The `flow-run` CLI — the autonomous loop: CEO decides, executor implements + verifies each
  # ready task, runtime tracks status and advances waves.
  #   docker compose run --rm run /work/config.json
  # (config + targetDir live on the volume; needs a real LLM backend)
  run:
    build:
      context: .
      target: runtime
    image: flow-harness
    entrypoint: ["node", "/app/packages/orchestrator/dist/cli.js"]
    environment:
      FLOW_HOME: /work/.flow
      FLOW_LLM_PROVIDER: ${FLOW_LLM_PROVIDER:-fake}
      FLOW_LLM_BASE_URL: ${FLOW_LLM_BASE_URL:-}
      FLOW_LLM_API_KEY: ${FLOW_LLM_API_KEY:-}
      FLOW_LLM_MODEL: ${FLOW_LLM_MODEL:-}
      FLOW_LLM_TIER: ${FLOW_LLM_TIER:-sonnet}
    volumes:
      - flow-state:/work

volumes:
  flow-state:
  exec-work:
